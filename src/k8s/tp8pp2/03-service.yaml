apiVersion: v1
kind: Service
metadata:
  name: vllm-api
  namespace: vllm-kimi
  labels:
    app: vllm-api
spec:
  type: NodePort
  selector:
    app: ray-vllm
    role: head
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP
    nodePort: 30800  # External access via g327:30800
  - name: ray-dashboard
    port: 8265
    targetPort: 8265
    protocol: TCP
    nodePort: 30265  # Ray dashboard at g327:30265
