apiVersion: v1
kind: Pod
metadata:
  name: ray-head
  namespace: vllm-kimi
  labels:
    app: ray-vllm
    role: head
spec:
  # Pin to g327
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - g327

  # Use host network for optimal InfiniBand performance
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet

  containers:
    - name: ray-head
      image: vllm/vllm-openai:latest
      imagePullPolicy: Always

      command:
        - /bin/bash
        - -c
        - |
          # Install vLLM nightly with Kimi-K2 support
          pip install -U vllm --pre --extra-index-url https://wheels.vllm.ai/nightly
          pip install opentelemetry-api \
                      opentelemetry-sdk \
                      opentelemetry-exporter-otlp \
                      opentelemetry-instrumentation-fastapi

          # Use official vLLM multi-node serving script
          bash /vllm-workspace/examples/online_serving/multi-node-serving.sh leader \
            --ray_cluster_size=2 \
            --ray_port=6379 \
            --ray_init_timeout=600

          # Start vLLM server with TP=8 + PP=2 (recommended for 2 nodes)
          vllm serve moonshotai/Kimi-K2-Thinking \
            --host 0.0.0.0 \
            --port 8000 \
            --tensor-parallel-size 16 \
            --distributed-executor-backend ray \
            --enable-auto-tool-choice \
            --tool-call-parser kimi_k2 \
            --reasoning-parser kimi_k2 \
            --trust-remote-code \
            --max-model-len 8192 \
            --gpu-memory-utilization 0.90 \
            --max-num-batched-tokens 32768 \
            --swap-space 32 \
            --max-num-seqs 256 \
            --otlp-traces-endpoint="grpc://jaeger-collector:4317"
            # --enforce-eager # To remove when using it in production, just makes it faster to start the server

      ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        - containerPort: 6379
          name: ray-gcs
          protocol: TCP
        - containerPort: 8265
          name: ray-dashboard
          protocol: TCP

      resources:
        requests:
          cpu: "32"
          memory: "300Gi"
          nvidia.com/gpu: 8
        limits:
          cpu: "60"
          memory: "500Gi"
          nvidia.com/gpu: 8

      volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        - name: model-cache
          mountPath: /root/.cache/huggingface

      env:
        - name: VLLM_HOST_IP
          value: "10.15.35.65" # g327 IP

        - name: CUDA_VISIBLE_DEVICES
          value: "0,1,2,3,4,5,6,7"
        - name: NCCL_DEBUG
          value: "INFO"
        - name: NCCL_SOCKET_IFNAME
          value: "enp157s0f0np0" # Use actual interface
        - name: GLOO_SOCKET_IFNAME
          value: "enp157s0f0np0"

        - name: RAY_DEDUP_LOGS
          value: "0"

        - name: HF_HOME
          value: "/root/.cache/huggingface"

        - name: OTEL_SERVICE_NAME
          value: "kimi-k2-thinking"
        - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
          value: "grpc://jaeger-collector:4317"
        - name: OTEL_EXPORTER_OTLP_TRACES_INSECURE
          value: "true"

  volumes:
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 100Gi
    - name: model-cache
      hostPath:
        path: /data/models/huggingface
        type: DirectoryOrCreate

  restartPolicy: Always
