apiVersion: v1
kind: Pod
metadata:
  name: ray-worker
  namespace: vllm-kimi
  labels:
    app: ray-vllm
    role: worker
spec:
  # Pin to g268
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - g268

  # Use host network for optimal InfiniBand performance
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet

  # Tolerate Cilium taint (hostNetwork pods don't need Cilium networking)
  tolerations:
    - key: node.cilium.io/agent-not-ready
      operator: Exists
      effect: NoSchedule

  containers:
    - name: ray-worker
      image: vllm/vllm-openai:latest
      imagePullPolicy: Always

      command:
        - /bin/bash
        - -c
        - |
          pip install -U vllm --pre --extra-index-url https://wheels.vllm.ai/nightly

          # For debugging the IB interfaces
          # apt-get update && apt-get install -y infiniband-diags perftest
          # tail -f /dev/null


          bash /vllm-workspace/examples/online_serving/multi-node-serving.sh worker \
            --ray_address=$RAY_HEAD_IP \
            --ray_port=6379 \
            --ray_init_timeout=600

      resources:
        requests:
          cpu: "32"
          memory: "300Gi"
          nvidia.com/gpu: 8
        limits:
          cpu: "60"
          memory: "500Gi"
          nvidia.com/gpu: 8

      volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        - name: model-cache
          mountPath: /root/.cache/huggingface

      securityContext:
        privileged: true
        capabilities:
          add:
            - IPC_LOCK
            - SYS_ADMIN

      env:
        - name: VLLM_HOST_IP
          value: "10.15.31.105" # g268 IP

        - name: RAY_HEAD_IP
          value: "10.15.31.25" # g258 IP

        - name: GLOO_SOCKET_IFNAME
          value: "enp157s0f0np0"
        - name: TP_SOCKET_IFNAME
          value: "enp157s0f0np0"
        - name: NCCL_SOCKET_IFNAME
          value: "enp157s0f0np0"

        - name: CUDA_VISIBLE_DEVICES
          value: "0,1,2,3,4,5,6,7"
        - name: NCCL_DEBUG
          value: "INFO"
        - name: NCCL_IB_HCA
          value: "mlx5_0,mlx5_3,mlx5_4,mlx5_5,mlx5_6,mlx5_9,mlx5_10,mlx5_11"
        - name: NCCL_IB_DISABLE
          value: "0"
        - name: NCCL_NET_GDR_LEVEL
          value: "SYS"
        - name: NCCL_P2P_LEVEL
          value: "PIX"
        - name: NCCL_IB_GID_INDEX
          value: "3"
        - name: NCCL_IB_TIMEOUT
          value: "22"

        - name: RAY_DEDUP_LOGS
          value: "0"

        - name: HF_HOME
          value: "/root/.cache/huggingface"

  volumes:
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 100Gi
    - name: model-cache
      hostPath:
        path: /data/models/huggingface
        type: DirectoryOrCreate

  restartPolicy: Always
