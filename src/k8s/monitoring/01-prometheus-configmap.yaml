---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'vllm'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ['vllm-kimi']
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: ray-vllm
            action: keep
          - source_labels: [__address__]
            regex: '([^:]+):\d+'
            replacement: '${1}:8000'
            target_label: __address__

      - job_name: 'nvidia-dcgm'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ['kube-nvidia']
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: nvidia-dcgm-exporter
            action: keep
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
          - source_labels: [__address__]
            regex: '([^:]+):\d+'
            replacement: '${1}:9400'
            target_label: __address__
